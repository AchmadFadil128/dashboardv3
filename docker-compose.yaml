services:
  # --- DATABASE SECTION ---
  postgres:
    image: postgres:15-alpine
    container_name: porto_dashboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-porto_dashboard}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-porto_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - porto_network

  # --- DASHBOARD SERVICE ---
  dashboardsvc:
    image: ramdhanistars/dashboardsvc:latest
    container_name: porto_dashboard_svc
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-porto_dashboard}
      JWT_SECRET: ${JWT_SECRET:-s3rv1c3_d4shb04rd_jwt_s3cr3t_k3y_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - porto_network

networks:
  porto_network:
    driver: bridge